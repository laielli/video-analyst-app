[pytest]
# First pytest suite for api/. Run from api/:  python -m pytest -q
# pythonpath puts the api package root (.), scripts/, and eval/ on sys.path so tests can
# `import precompute`, `from interpreter import ...`, `from vision... import ...`,
# `import run_program`, `import validate_run_doc`, and `import bank`/`scoring`/`run_eval` — the
# same script-import path the probes + eval CLI use at runtime (run_eval.py inserts eval/ itself).
testpaths = tests
pythonpath = . scripts eval
addopts = -ra
# pytest-asyncio in auto mode so the async cancel test in test_sse_stream.py collects without
# a per-test @pytest.mark.asyncio marker.
asyncio_mode = auto
