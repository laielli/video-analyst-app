[pytest]
# First pytest suite for api/. Tests live in api/tests/. pythonpath makes the api package
# root (".") and the scripts dir importable so tests can `import precompute`, `from interpreter
# import ...`, and reuse `run_program` / `validate_run_doc` / `ocr_probe` like the CLIs do.
testpaths = tests
pythonpath = . scripts
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
