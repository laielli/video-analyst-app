[pytest]
# First pytest suite for api/. Run from api/:  python -m pytest -q
# pythonpath puts the api package root (.) and scripts/ on sys.path so tests can
# `import precompute`, `from interpreter import ...`, `from vision... import ...`,
# `import run_program`, `import validate_run_doc` — the same script-import path the
# probes use at runtime.
testpaths = tests
pythonpath = . scripts
addopts = -ra
# pytest-asyncio collects the SSE-stream cancel test (body_iterator.athrow CancelledError)
# without per-test @pytest.mark.asyncio markers.
asyncio_mode = auto
