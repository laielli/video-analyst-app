[pytest]
# First pytest suite for api/. testpaths scopes collection to tests/.
# pythonpath puts the api/ dir (so `interpreter`, `vision`, `validate_program` resolve)
# AND scripts/ (so `precompute`, `ocr_probe`, `run_program` import the way they do at
# runtime via their sys.path hack). Order matters: api/ first so package imports win.
testpaths = tests
pythonpath = . scripts
addopts = -q
