name: CI

# First CI gate: a Python pytest job + a Node build/type-check/test job. Two independent jobs
# (no cross-dependency) so a failure in one doesn't mask the other (fail-fast: false). Coverage
# is measured but NEVER gated (no --cov-fail-under / no coverage threshold).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: api · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Run pytest (with non-gating coverage)
        working-directory: api
        run: python -m pytest -q --cov=. --cov-report=term-missing

  web:
    name: web · build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build (static export)
        working-directory: web
        run: npm run build
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Run tests (with coverage)
        working-directory: web
        run: npm run test:cov
