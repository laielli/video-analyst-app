name: CI

# First CI gate: a two-job matrix (independent python + web jobs) on push + PR to main.
# Coverage is now gated against calibrated floors (~5pp below the natural numbers, floored to a
# multiple of 5): python via `pytest --cov-fail-under=85`, web via vitest coverage.thresholds in
# web/vitest.config.ts. Local `python -m pytest -q` stays un-gated for red-green cycles. The web
# job runs a flat-config ESLint gate (eslint-config-next, ESLint 9) + next build + tsc --noEmit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install deps
        run: pip install -r api/requirements.txt
      - name: Run tests (coverage gated at floor)
        working-directory: api
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=85
      - name: Codegen eval (replay-mode regression gate)
        working-directory: api
        run: python eval/run_eval.py replay --fail-under T2_semantic_valid=0.95 --fail-under T4_answer_correct=0.70

  web:
    name: Web (build + tsc + vitest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint (eslint flat config)
        run: npm run lint
      - name: Build (static export)
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit
      - name: Run tests (coverage gated at thresholds)
        run: npm run test:cov
