name: CI

# First CI gate for the repo: a Python job (pytest over api/) and a Node job (build +
# type-check + vitest over web/), run as two independent jobs on push and PRs to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Run pytest (with non-gating coverage)
        working-directory: api
        # pytest.ini sets pythonpath = . scripts and testpaths = tests. Coverage is reported
        # but never gating (no --cov-fail-under) per the test+CI-only scope.
        run: python -m pytest -q --cov=. --cov-report=term-missing

  web:
    name: Web (next + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        # npm ci fails hard on any package.json/lock mismatch — the regenerated lockfile is
        # committed alongside the new devDeps so this stays green.
        run: npm ci
      - name: Build (static export)
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit
      - name: Run vitest (with non-gating coverage)
        run: npm run test:cov
