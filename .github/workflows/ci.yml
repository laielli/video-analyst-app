name: CI

# First CI gate: a Python pytest job + a Node web build/type-check/test job. Both run on push
# and pull_request to main. The two jobs are independent (fail-fast: false) so a red web job
# doesn't mask a green Python job and vice versa. Coverage is measured but NEVER gating.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: api · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install deps
        run: pip install -r api/requirements.txt
      - name: Run pytest (with non-gating coverage)
        working-directory: api
        run: python -m pytest -q --cov=. --cov-report=term-missing

  web:
    name: web · build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      - name: Build (static export)
        working-directory: web
        run: npm run build
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Run vitest (with non-gating coverage)
        working-directory: web
        run: npm run test:cov
